# fly.toml app configuration file generated for portkey-favicon-api on 2026-08-03T10:20:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portkey-favicon-api'
primary_region = 'ams'

[build]
  image = 'docker.io/vemetric/favicon-api:1.0.0'

[env]
  ALLOWED_ORIGINS = 'https://demo.portkey.page,https://portkey-demo.fly.dev'
  DEFAULT_IMAGE_URL = 'none'
  REDIRECT_URL = 'https://github.com/kodehat/portkey/tree/main/favicon-api'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = 'shared-cpu-1x'
