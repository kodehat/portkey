name: Update release description

on: 
  release:
    types: [ created ]

jobs:

  release-description:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Generate a changelog
      uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
      with:
        config: cliff.toml
        # Always using latest here instead of specific tag only until implemented.
        # See: https://github.com/orhun/git-cliff/issues/1133
        args: --latest --strip "header" --exclude-path "CHANGELOG.md"
      env:
        OUTPUT: CHANGELOG.md

    - name: Update release description
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        allowUpdates: true
        bodyFile: CHANGELOG.md